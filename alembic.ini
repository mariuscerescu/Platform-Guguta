# Alembic configuration for the Guguță PostgreSQL stack (ADR-0001).
# The database URL comes from the environment (GUGUTA_DATABASE_URL_MIGRATOR),
# never from this file — no secrets in Git (R08).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Alembic version table for the Guguță stack (separate from any legacy tooling).
version_table = guguta_alembic
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
