# Platforma Guguță — stack de PRODUCȚIE pentru https://tineri.math.md/edu-platform
#
# Diferențe față de docker-compose.guguta.yml (dezvoltare):
#   - GUGUTA_ENVIRONMENT=production: configurația refuză secretele de dev,
#     originile http și furnizorii simulați (open_notebook/database/guguta/config.py).
#   - Doar frontend-ul este publicat, pe 127.0.0.1:${GUGUTA_HTTP_PORT}.
#     API-ul, worker-ul și baza de date rămân în rețeaua internă a stack-ului:
#     browserul vorbește doar cu frontend-ul, care proxează /guguta-api către API.
#   - Frontend-ul este construit cu basePath (GUGUTA_BASE_PATH=/edu-platform),
#     deci nginx-ul gazdă NU taie prefixul: trimite calea întreagă mai departe.
#   - Fără nginx intern: nu avem ce prefix să tăiem (spre deosebire de stack-ul
#     ttsdatasetbuilder, care are două aplicații în spatele unui singur port).
#
# Utilizare (din acest director):
#   docker compose up -d --build
#   docker compose ps
#   curl -s http://127.0.0.1:8300/edu-platform/guguta-api/healthz

# DSN-urile de runtime, compuse o singură dată aici (în .env nu stau DSN-uri cu
# nume de gazdă Docker). Toate trei se dau și API-ului și worker-ului: în afara
# mediului de dezvoltare configurația cere explicit ca AMBELE roluri de runtime
# să fie declarate (open_notebook/database/guguta/config.py), iar fiecare proces
# se conectează oricum doar cu rolul lui (API → guguta_api, worker → guguta_worker).
x-db-dsns: &db-dsns
  GUGUTA_DATABASE_URL_MIGRATOR: postgresql+psycopg://guguta_migrator:${GUGUTA_PG_MIGRATOR_PASSWORD}@db:5432/guguta
  GUGUTA_DATABASE_URL_API: postgresql+psycopg://guguta_api:${GUGUTA_PG_API_PASSWORD}@db:5432/guguta
  GUGUTA_DATABASE_URL_WORKER: postgresql+psycopg://guguta_worker:${GUGUTA_PG_WORKER_PASSWORD}@db:5432/guguta

services:
  # --- PostgreSQL 17 + pgvector (imagine fixată prin digest, R02/R03) ---
  db:
    image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
    environment:
      POSTGRES_DB: guguta
      POSTGRES_USER: guguta_migrator
      POSTGRES_PASSWORD: ${GUGUTA_PG_MIGRATOR_PASSWORD:?setează GUGUTA_PG_MIGRATOR_PASSWORD în .env}
      # Citite o singură dată, la prima pornire cu volum gol, de bootstrap-roles.sh.
      GUGUTA_PG_API_PASSWORD: ${GUGUTA_PG_API_PASSWORD:?setează GUGUTA_PG_API_PASSWORD în .env}
      GUGUTA_PG_WORKER_PASSWORD: ${GUGUTA_PG_WORKER_PASSWORD:?setează GUGUTA_PG_WORKER_PASSWORD în .env}
    volumes:
      - guguta_pg_data:/var/lib/postgresql/data
      - ../../docker/guguta/bootstrap-roles.sh:/docker-entrypoint-initdb.d/01-bootstrap-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guguta_migrator -d guguta"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # --- Migrarea schemei: un singur punct de intrare per release (ADR-0007) ---
  # API-ul și worker-ul nu rulează niciodată migrări la pornire.
  migrator:
    build:
      context: ../..
      dockerfile: docker/guguta/migrator.Dockerfile
    environment:
      GUGUTA_DATABASE_URL_MIGRATOR: postgresql+psycopg://guguta_migrator:${GUGUTA_PG_MIGRATOR_PASSWORD}@db:5432/guguta
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # --- MOSS-TTS privat, voce romaneasca clonata din referinta validata ------
  # Foloseste mediul/modelul deja instalat pe gazda; nici modelul, nici vocea
  # nu intra in imagine sau in Git. Serviciul nu publica niciun port.
  moss-tts:
    image: python:3.12-slim@sha256:d764629ce0ddd8c71fd371e9901efb324a95789d2315a47db7e4d27e78f1b0e9
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GUGUTA_MOSS_TTS_GPU:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      TQDM_DISABLE: "1"
      MOSS_TTS_RUNTIME_ROOT: /opt/moss-runtime
      MOSS_TTS_REFERENCE_AUDIO: /voices/romanian.wav
      MOSS_TTS_REFERENCE_API_PATH: /voices/romanian.wav
      MOSS_TTS_DEVICE: cuda:0
    volumes:
      - ${GUGUTA_MOSS_TTS_RUNTIME_ROOT:?setează GUGUTA_MOSS_TTS_RUNTIME_ROOT}:/opt/moss-runtime:ro
      - ${GUGUTA_MOSS_TTS_REFERENCE_AUDIO_HOST:?setează GUGUTA_MOSS_TTS_REFERENCE_AUDIO_HOST}:/voices/romanian.wav:ro
      - ../../scripts/guguta_moss_tts_server.py:/srv/guguta_moss_tts_server.py:ro
    working_dir: /srv
    command:
      - /opt/moss-runtime/.venv/bin/python
      - -m
      - uvicorn
      - guguta_moss_tts_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - /opt/moss-runtime/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  # --- Recunoaștere vocală românească, Parakeet 110M (NeMo) ---------------
  # Runtime-ul NeMo este instalat o singură dată pe gazdă și montat read-only;
  # cache-ul Hugging Face rămâne într-un volum privat și persistent.
  parakeet-asr:
    build:
      context: ../..
      dockerfile: docker/guguta/asr.Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GUGUTA_PARAKEET_ASR_GPU:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models/huggingface
      NEMO_CACHE_DIR: /models/nemo
      PARAKEET_ASR_MODEL_ID: gabrielpirlo/Sped_ParakeetRomanian_110M_TDT-CTC
      PARAKEET_ASR_MODEL_FILE: SpeD-ParakeetRo_110M_TDT-CTC.nemo
      PARAKEET_ASR_DEVICE: cuda:0
      PARAKEET_ASR_MAX_AUDIO_MIB: "15"
    volumes:
      - ${GUGUTA_PARAKEET_ASR_RUNTIME_ROOT:-/home/jupyter-marius/Parakeet-ASR}:/opt/parakeet-runtime:ro
      - parakeet_asr_models:/models
      - ../../scripts/guguta_parakeet_asr_server.py:/srv/guguta_parakeet_asr_server.py:ro
    command:
      - /opt/parakeet-runtime/.venv/bin/python
      - -m
      - uvicorn
      - guguta_parakeet_asr_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - /opt/parakeet-runtime/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz').read()"
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 240s
    restart: unless-stopped

  # --- Retrieval multilingual local: Qwen3 Embedding + Reranker 0.6B ------
  # Ambele modele stau într-un singur proces privat pe GPU 0. Reviziile sunt
  # fixate, iar cache-ul Hugging Face persistă separat de imagine.
  qwen-retrieval:
    build:
      context: ../..
      dockerfile: docker/guguta/retrieval.Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GUGUTA_QWEN_RETRIEVAL_GPU:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: error
      QWEN_RETRIEVAL_DEVICE: cuda:0
      QWEN_EMBEDDING_MODEL: ${GUGUTA_LOCAL_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      QWEN_EMBEDDING_REVISION: ${GUGUTA_LOCAL_EMBEDDING_REVISION:-97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3}
      QWEN_RERANK_MODEL: ${GUGUTA_LOCAL_RERANK_MODEL:-Qwen/Qwen3-Reranker-0.6B}
      QWEN_RERANK_REVISION: ${GUGUTA_LOCAL_RERANK_REVISION:-e61197ed45024b0ed8a2d74b80b4d909f1255473}
      QWEN_RETRIEVAL_MAX_LENGTH: "2048"
      QWEN_EMBEDDING_BATCH_SIZE: "16"
      QWEN_RERANK_BATCH_SIZE: "2"
    volumes:
      - ${GUGUTA_QWEN_RETRIEVAL_RUNTIME_ROOT:-/home/jupyter-marius/Parakeet-ASR}:/opt/qwen-runtime:ro
      - qwen_retrieval_models:/models
      - ../../scripts/guguta_qwen_retrieval_server.py:/srv/guguta_qwen_retrieval_server.py:ro
    command:
      - /opt/qwen-runtime/.venv/bin/python
      - -m
      - uvicorn
      - guguta_qwen_retrieval_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - /opt/qwen-runtime/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/healthz').read()"
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 300s
    restart: unless-stopped

  # --- OCR local rapid pentru acoperirea vizuală a fiecărei pagini -----------
  # LiteParse păstrează textul nativ; fiecare pagină este randată și verificată
  # și de PP-OCRv5 Mobile pe GPU 1 pentru textul inclus în imagini.
  ppocr:
    build:
      context: ../..
      dockerfile: docker/guguta/ppocrv5.Dockerfile
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${GUGUTA_PPOCR_GPU:-1}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PPOCR_DEVICE: gpu:0
      PPOCR_MIN_CONFIDENCE: ${GUGUTA_PPOCR_MIN_CONFIDENCE:-0.35}
      PPOCR_MAX_IMAGE_MIB: "25"
      PADDLE_PDX_CACHE_HOME: /models/paddlex
    volumes:
      - ppocr_models:/models
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/readyz').read()"
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  # --- API (FastAPI, doar /api/v1 + /healthz, /readyz, /versionz) ---
  api:
    build:
      context: ../..
      dockerfile: docker/guguta/api.Dockerfile
      args:
        GUGUTA_COMMIT: ${GUGUTA_COMMIT:-unknown}
    env_file:
      - .env
    environment:
      <<: *db-dsns
      GUGUTA_STORAGE_ROOT: /data/guguta_storage
      GUGUTA_PARAKEET_ASR_BASE_URL: http://parakeet-asr:8001
      GUGUTA_LOCAL_RETRIEVAL_BASE_URL: http://qwen-retrieval:8002
    volumes:
      - guguta_storage:/data/guguta_storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/healthz').read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      qwen-retrieval:
        condition: service_healthy
    restart: unless-stopped

  # --- Worker pentru procesarea materialelor (embedding, extragere text) ---
  worker:
    build:
      context: ../..
      dockerfile: docker/guguta/api.Dockerfile
      args:
        GUGUTA_COMMIT: ${GUGUTA_COMMIT:-unknown}
    env_file:
      - .env
    environment:
      <<: *db-dsns
      GUGUTA_STORAGE_ROOT: /data/guguta_storage
      GUGUTA_JOB_WORKER_NAME: guguta-worker-1
      GUGUTA_LOCAL_RETRIEVAL_BASE_URL: http://qwen-retrieval:8002
      GUGUTA_PDF_PARSER: liteparse_ppocr
      GUGUTA_PPOCR_BASE_URL: http://ppocr:8003
      GUGUTA_PPOCR_TIMEOUT_SECONDS: ${GUGUTA_PPOCR_TIMEOUT_SECONDS:-120}
      GUGUTA_PDF_OCR_DPI: ${GUGUTA_PDF_OCR_DPI:-120}
      GUGUTA_PDF_OCR_EVERY_PAGE: ${GUGUTA_PDF_OCR_EVERY_PAGE:-true}
      GUGUTA_PDF_OCR_RENDER_BATCH_PAGES: ${GUGUTA_PDF_OCR_RENDER_BATCH_PAGES:-10}
      GUGUTA_PDF_OCR_CONCURRENCY: ${GUGUTA_PDF_OCR_CONCURRENCY:-10}
    volumes:
      - guguta_storage:/data/guguta_storage
    command: ["python", "-m", "open_notebook.jobs.guguta.worker"]
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      moss-tts:
        condition: service_healthy
      qwen-retrieval:
        condition: service_healthy
      ppocr:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend Next.js, construit cu basePath=/edu-platform ---
  frontend:
    build:
      context: ../..
      dockerfile: docker/guguta/frontend.Dockerfile
      args:
        # Intră în bundle-ul de client: schimbarea lui cere REBUILD, nu doar restart.
        GUGUTA_BASE_PATH: ${GUGUTA_BASE_PATH:-/edu-platform}
    environment:
      # Folosit de rewrites() pentru proxy-ul same-origin; e copt la build.
      GUGUTA_API_URL: http://api:5055
      PORT: "3001"
    ports:
      # Doar pe loopback: nginx-ul gazdă este singurul care ajunge aici.
      - "127.0.0.1:${GUGUTA_HTTP_PORT:-8300}:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  guguta_pg_data:
  guguta_storage:
  parakeet_asr_models:
  qwen_retrieval_models:
  ppocr_models:
