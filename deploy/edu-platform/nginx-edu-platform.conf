# ============================================================================
# Platforma Guguță — publicare la https://tineri.math.md/edu-platform
#
# Ce trebuie să faci: adaugă blocul `location /edu-platform { ... }` de mai jos
# în blocul `server { ... }` care servește deja `tineri.math.md` (de regulă în
# /etc/nginx/sites-enabled/<site> sau /etc/nginx/conf.d/<site>.conf).
#
# NU este nevoie să tai prefixul `/edu-platform`: frontend-ul Next.js este
# construit cu basePath=/edu-platform și așteaptă calea întreagă. De aceea
# `proxy_pass` este scris FĂRĂ „/" la final — cu „/" nginx ar tăia prefixul și
# aplicația ar răspunde 404.
#
# După modificare: nginx -t && systemctl reload nginx
# ============================================================================

location /edu-platform {
    proxy_pass http://127.0.0.1:8300;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Materialele urcate de utilizatori merg până la 25 MiB
    # (GUGUTA_MAX_UPLOAD_MIB). Implicit nginx taie corpul cererii la 1 MiB,
    # iar simptomul este „413 Request Entity Too Large" la adăugarea unui PDF.
    client_max_body_size 32m;

    # Chatul răspunde în flux (Server-Sent Events). Cu buffering pornit, nginx
    # ține răspunsul până se termină generarea și textul apare dintr-o dată,
    # deși aplicația îl trimite bucată cu bucată.
    proxy_buffering off;
    proxy_cache off;

    # Generarea unui răspuns poate dura câteva minute (modele gratuite):
    # aliniat cu GUGUTA_CHAT_TOTAL_TIMEOUT_SECONDS=300 + marjă.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;
}


# ============================================================================
# Referință: cum arată un bloc `server` complet, dacă preferi un fișier separat.
# De obicei NU ai nevoie de el — certificatul TLS și restul sunt deja configurate
# pentru tineri.math.md; trebuie adăugat doar `location`-ul de mai sus.
# ============================================================================
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     server_name tineri.math.md;
#
#     ssl_certificate     /etc/letsencrypt/live/tineri.math.md/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/tineri.math.md/privkey.pem;
#
#     # Aplicațiile existente de pe acest server rămân neatinse:
#     #   /datasetBuilder/   -> 127.0.0.1:8000  (ttsdatasetbuilder/webapp)
#     #   /voiceRecording/   -> 127.0.0.1:8000  (ttsdatasetbuilder/voiceRecordingWebApp)
#
#     location /edu-platform {
#         proxy_pass http://127.0.0.1:8300;
#         # ... (blocul de mai sus)
#     }
# }
#
# server {
#     listen 80;
#     server_name tineri.math.md;
#     return 301 https://$host$request_uri;
# }
